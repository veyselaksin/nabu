[project]
name = "nabu-llm"
version = "0.1.0"
description = "LoRA fine-tuning (mlx-lm) and serving of Nabu's translation model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Base install: config handling only (CI and Linux stay light).
dependencies = ["pyyaml>=6.0", "nabu-tts"]

[project.optional-dependencies]
# Apple Silicon only.
mlx = [
  "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",                  # MIT
  "mlx-lm[train]>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",        # MIT
]

[project.scripts]
nabu-llm-train = "nabu_llm.train:main"
nabu-llm-serve = "nabu_llm.serve:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"
