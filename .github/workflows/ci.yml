name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: |
          out=$(gofmt -l g2p script data translate tts api)
          if [ -n "$out" ]; then echo "::error::gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./g2p/... ./script/... ./data/... ./translate/... ./tts/... ./api/...
      # tts.TestModelIntegration is skipped here (no model); the tts job runs it.
      - name: go test
        run: go test -race ./g2p/... ./script/... ./data/... ./translate/... ./tts/... ./api/...
      - name: g2p and script build for WASM
        run: GOOS=js GOARCH=wasm go build ./g2p/... ./script/...
      - name: modules are tidy
        run: |
          (cd g2p && go mod tidy -diff)
          (cd script && go mod tidy -diff)
          (cd data && go mod tidy -diff)
          (cd translate && go mod tidy -diff)
          (cd tts && go mod tidy -diff)
          (cd api && go mod tidy -diff)

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        run: uv run pytest

  # End-to-end TTS smoke test on CPU: synthetic data → a few training steps →
  # ONNX export with parity check → Go runtime integration test. Proves the
  # Python trainer and the Go runtime agree (symbol table, ONNX signature).
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      # CPU-only torch on Linux (see [tool.uv.sources] in pyproject.toml).
      - run: uv sync --locked --all-packages --all-extras
      - name: pytest (with training extras)
        run: uv run pytest tts/train
      - name: smoke train + export
        run: |
          uv run nabu-tts-smoke-data --out runs/smoke-data
          uv run nabu-tts-train --config tts/train/configs/smoke.yaml --set train.max_steps=20 --set train.eval_every=20 --set train.checkpoint_every=20
          uv run nabu-tts-export --checkpoint runs/smoke/checkpoints/latest.pt --out runs/smoke/model.onnx
      - name: Go runtime against the exported model
        run: make test-tts-integration MODEL=runs/smoke/model.onnx

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: dependency licenses
        run: npm run licenses
      - run: npm run build

  # Rebuilds the committed sign list from the pinned upstream files and checks
  # it is byte-identical (TestCommittedSignListIsReproducible), and that a
  # lexicon builds and loads. Downloads ~6 MB; nothing is committed or cached.
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: go run ./data/cmd/nabu-data fetch unikemet tla
      - run: go test -count=1 -run Reproducible -v ./data/cmd/nabu-data
      # Retrieval and the CLI against the real corpus (the model is faked).
      - run: go test -count=1 -v ./translate/cmd/nabu-translate

  docker:
    runs-on: ubuntu-latest
    needs: [go, tts]
    steps:
      - uses: actions/checkout@v7
      - name: build API image
        run: docker build -f api/Dockerfile -t nabu-api:ci .
