server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the API through Docker's DNS at request time, so nginx starts
    # even while the api container is still coming up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /v1/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # Translation runs a language model on CPU; the API allows 3 minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1m;
    }

    location = /healthz {
        proxy_pass $api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
