# Middle Egyptian, following James P. Allen's historical reconstruction.
#
# !!! PLACEHOLDER RULE FILE !!!
# None of the mappings below have been taken from Allen yet. They are toy
# values that exist only so the engine, CLI, API and tests have something to
# run against. Do NOT cite this file or its output as a pronunciation.
#
# A real reconstruction also needs vowels, which Egyptian transliteration does
# not write; a grapheme-to-phoneme table alone cannot supply them. How Nabu
# will model that (lexicon lookup, syllable templates, ...) is still open.
#
# TODO(source): replace every rule below with values from Allen (2013),
#               citing the page/section for each one in a comment.
