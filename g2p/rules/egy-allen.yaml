  # Editorial marks of the TLA transliteration, explicitly silent.
  # Morpheme boundary in transliteration (e.g. "ꜥnḫ.t").
  # TODO(source): confirm which separators the transliteration standard uses.
  - { match: ".", ipa: "" }
