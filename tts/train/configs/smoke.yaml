# Smoke test: proves data loading, training, checkpointing, MLflow logging and
# ONNX export work end to end. A few hundred steps on CPU, in minutes.
# Data comes from `nabu-tts-smoke-data` (synthetic tones, not speech), so the
# resulting model is useless for listening. Run from the repository root:
#
#   uv run nabu-tts-smoke-data --out runs/smoke-data
#   uv run nabu-tts-train --config tts/train/configs/smoke.yaml
run_name: smoke
output_dir: runs/smoke
data:
  manifests: [runs/smoke-data/manifest.jsonl]
  val_size: 4
  sample_rate: 16000
  filter_length: 512
  hop_length: 128
  win_length: 512
  n_mel_channels: 64
  add_blank: true
  max_tokens: 100
train:
  device: cpu
  max_steps: 300
  batch_size: 8
  learning_rate: 2.0e-4
  segment_size: 4096   # 32 frames
  num_workers: 0
  log_every: 25
  eval_every: 150
  checkpoint_every: 150
  keep_checkpoints: 2
  bucket_boundaries: [60, 90, 120]
model:
  inter_channels: 64
  hidden_channels: 64
  filter_channels: 128
  n_heads: 2
  n_layers: 2
  kernel_size: 3
  p_dropout: 0.1
  resblock: "2"
  resblock_kernel_sizes: [3, 5]
  resblock_dilation_sizes: [[1, 3], [1, 3]]
  upsample_rates: [8, 8, 2]          # product = hop_length
  upsample_initial_channel: 64
  upsample_kernel_sizes: [16, 16, 4]
  gin_channels: 32
  use_sdp: true
mlflow:
  tracking_uri: sqlite:///runs/mlflow.db
  experiment: nabu-tts-smoke
